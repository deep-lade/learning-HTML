<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Students Registration Form</title>
    </head>
    <body>
        <h1 style="color:#B0E0E6;text-align:center;font-family:cursive,comic sans MS">Students Registration Form</h1>
<hr>     

	<form action="#" method="POST">
            <label for="firstname">First Name:</label>
            <input type="text" id="firstname" name="firstname" required />
            <br /><br />
	
	
            <label for="middlename">Middle Name:</label>
            <input type="text" id="middlename" name="middlename" />
            <br /><br />

            <label for="lastname">Last Name:</label>
            <input type="text" id="lastname" name="lastname" required />
            <br /><br />
<hr>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" />
            <br /><br />

            <label>Gender:</label>
            <label><input type="radio" name="gender" value="male" /> Male</label>
            <label><input type="radio" name="gender" value="female" /> Female</label>
            <label><input type="radio" name="gender" value="other" /> Other</label>
            <br /><br />

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" />
            <br /><br />

            <label for="rollno">Roll Number:</label>
            <input type="text" id="rollno" name="rollno" />
            <br /><br />

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required />
            <br /><br />
<hr>
            <label for="year">Year:</label>
            <select id="year" name="year">
                <option value="1">First Year</option>
                <option value="2">Second Year</option>
                <option value="3">Third Year</option>
                <option value="4">Fourth Year</option>
            </select>
            <br /><br />

            <label for="course">Course:</label>
            <select id="course" name="course">
                <option value="bca">BCA</option>
                <option value="btech">B.Tech</option>
                <option value="bba">BBA</option>
                <option value="bsc">B.Sc</option>
            </select>
            <br /><br />
<hr>
            <input style="color:green"type="submit" value="Register" />
            <input style="color:red"type="reset" value="Clear" />
        </form>
    </body>
</html>
